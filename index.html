<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Мой Домашний Сайт — NFlike</title>

<link rel="icon" href="favicon.png" type="image/png">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="window">
  <div class="title-bar">
    <div class="title-text">
      <span>🌐</span>
      <span>Мой Домашний Сайт — NFlike</span>
    </div>
  </div>

<div class="top-nav-bar">
    <a href="#" class="home-btn" id="home-btn">ГЛАВНАЯ</a>
    <a href="#" class="home-btn" id="chat-btn" style="margin-left: 5px;">ЧАТИК</a>
  </div>

  <div class="main-content">
    <!-- Сюда скрипт вставит кнопки меню -->
    <div class="sidebar"></div>

    <!-- Правая колонка -->
    <div class="content-area" id="content-wrapper">
      
      <!-- Блок с анимацией загрузки -->
      <div class="loading-container" id="loading-bar">
        <div class="loading-text">Загрузка:</div>
        <div class="loading-blocks" id="loading-blocks-container">
          <!-- Квадратики создаются через JS -->
        </div>
      </div>

      <!-- Сюда будет загружаться сам контент -->
      <div id="main-content">
        <p>Загрузка...</p>
      </div>

    </div>
  </div>
</div>

<!-- ===== НИЖНЯЯ ПАНЕЛЬ ===== -->
<div class="taskbar">
  <!-- Кнопки ресурсов добавляются сюда скриптом -->
  
  <!-- Блок, который прижмется вправо -->
  <div class="taskbar-right">
    <!-- Кнопки управления звуком и уведомлениями -->
    <div class="taskbar-controls" id="taskbar-controls">
      <button class="ctrl-btn" id="btn-sound" title="Вкл/Выкл звук">🔊</button>
      <button class="ctrl-btn" id="btn-notif" title="Вкл/Выкл уведомления">🔕</button>
    </div>

    <!-- Часы -->
    <div class="clock" id="system-clock">🕐 00:00</div>
  </div>
</div>

<!-- Контейнер для всплывающих окон -->
<div id="notification-container"></div>

<script src="script.js"></script>
</body>
</html>
