<h1>Моя музыка</h1>

<!-- Блок с описаниями тегов -->
<div id="tag-descriptions-container" style="margin-bottom: 10px;"></div>

<!-- ПАНЕЛЬ ФИЛЬТРОВ (Липкая) -->
<div class="music-filters">
  
  <div>
    <label style="font-weight: bold; font-size: 12px;">Сортировка:</label>
    <select id="sort-date" class="btn90" style="padding: 2px;">
      <option value="newest">Сначала новые</option>
      <option value="oldest">Сначала старые</option>
    </select>
  </div>

  <!-- ПОЛЗУНОК ГРОМКОСТИ -->
  <div style="display: flex; align-items: center; gap: 5px;">
    <label style="font-weight: bold; font-size: 12px;">🔊 Громкость:</label>
    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.25" style="width: 100px; cursor: pointer;">
  </div>

  <div style="display: flex; align-items: center; gap: 5px;">
    <label style="font-weight: bold; font-size: 12px;">Теги:</label>
    <div id="tags-container" style="display: flex; gap: 5px; flex-wrap: wrap;">
      <!-- Теги будут сгенерированы через JS -->
    </div>
  </div>

</div>

<div id="music-container">
  <p>Загрузка треков...</p>
</div>
